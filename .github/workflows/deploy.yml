name: Test and deploy to Cloud Run

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest -q

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/255733592751/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@waresim.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: waresim

      - name: Deploy to Cloud Run
        run: >-
          gcloud run deploy waresim
          --source .
          --project waresim
          --region asia-south1
          --allow-unauthenticated
          --concurrency 1
          --max 1
          --memory 512Mi
          --cpu 1
          --timeout 300
          --quiet
